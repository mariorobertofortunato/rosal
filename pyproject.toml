[project]
name = "rosal"
description = "Reverse Obfuscated Standard Android Libraries (ROSAL)"
version = "0.0.1"
requires-python = ">=3.10"
authors = [
  {name = "MRF", email = "nope@nope.com"}
]
maintainers = [
  {name = "MRF", email = "nope@nope.com"}
]
readme = "README.md"
keywords = ["android", "reverse engineering", "R8", "ProGuard", "deobfuscation", "kotlin", "Java", "JADX"]

dependencies = [
  "androguard>=4.1.3",
  "loguru>=0.7.2",
  "tqdm>=4.66.0",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Repository = "https://github.com/mariorobertofortunato/rosal"
Issues = "https://github.com/mariorobertofortunato/rosal/issues"

[project.scripts]
rosal = "rosal.__main__:main"